<ng-container *transloco="let t">
  <a class="skip-link" href="#main">{{ t('app.skipToContent') }}</a>

  <header class="bar">
    <a class="wordmark" routerLink="/" [attr.aria-label]="t('app.home')">TBCA</a>

    <div class="bar__actions">
      @if (auth.user()) {
        <a class="nav-link" routerLink="/pvp" routerLinkActive="nav-link--active">
          {{ t('app.arena') }}
        </a>
        <a class="nav-link" routerLink="/teams" routerLinkActive="nav-link--active">
          {{ t('app.teams') }}
        </a>
        <a class="nav-link" routerLink="/dungeon" routerLinkActive="nav-link--active">
          {{ t('app.dungeon') }}
        </a>
        <a class="nav-link" routerLink="/shop" routerLinkActive="nav-link--active">
          {{ t('app.shop') }}
        </a>
        <a class="nav-link" routerLink="/character" routerLinkActive="nav-link--active">
          {{ t('app.character') }}
        </a>
      }
      <div class="lang" role="group" [attr.aria-label]="t('app.language')">
        @for (locale of language.locales; track locale) {
          <button
            type="button"
            class="lang__option"
            [attr.aria-pressed]="language.current() === locale"
            (click)="setLanguage(locale)"
          >
            {{ locale.toUpperCase() }}
          </button>
        }
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="footer">
    <a routerLink="/impressum">{{ t('app.imprint') }}</a>
    <a routerLink="/datenschutz">{{ t('app.privacy') }}</a>
  </footer>
</ng-container>
